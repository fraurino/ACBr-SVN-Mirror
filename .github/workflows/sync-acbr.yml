name: Sincronizar ACBr SVN

on:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acbr-svn-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Instalar Subversion e rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion rsync

      - name: Verificar revisao SVN
        id: svn
        shell: bash
        env:
          SVN_URL: https://svn.code.sf.net/p/acbr/code/trunk2
        run: |
          set -euo pipefail
          REVISION=$(svn info --show-item revision "$SVN_URL")
          test -n "$REVISION"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          OLD_REVISION=$(cat .svn-revision 2>/dev/null || true)
          if [[ "$REVISION" == "$OLD_REVISION" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SVN ja sincronizado: r$REVISION"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Atualizacao detectada: r${OLD_REVISION:-nenhuma} -> r$REVISION"
          fi

      - name: Exportar revisao SVN
        if: steps.svn.outputs.changed == 'true'
        shell: bash
        env:
          SVN_URL: https://svn.code.sf.net/p/acbr/code/trunk2
          SVN_REVISION: ${{ steps.svn.outputs.revision }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acbr-export"
          svn export --non-interactive --force -r "$SVN_REVISION" "$SVN_URL" "$RUNNER_TEMP/acbr-export"

      - name: Espelhar arquivos no GitHub
        if: steps.svn.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            --exclude='/SECURITY.md' \
            --exclude='/CONTRIBUTING.md' \
            --exclude='/CODE_OF_CONDUCT.md' \
            --exclude='/scripts/' \
            --exclude='/wiki-content/' \
            --exclude='/.svn-revision' \
            "$RUNNER_TEMP/acbr-export/" ./
          printf '%s\n' "${{ steps.svn.outputs.revision }}" > .svn-revision
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao de arquivos."
            exit 0
          fi
          git commit -m "sync: ACBr SVN r${{ steps.svn.outputs.revision }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Resumo da verificacao
        if: always()
        shell: bash
        env:
          SVN_REVISION: ${{ steps.svn.outputs.revision }}
          SVN_CHANGED: ${{ steps.svn.outputs.changed }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## ACBr SVN Mirror'
            echo "- Resultado do job: **$JOB_STATUS**"
            echo "- Revisao consultada: **${SVN_REVISION:-indisponivel}**"
            echo "- Alteracao detectada: **${SVN_CHANGED:-indisponivel}**"
            echo "- Execucao: **${GITHUB_RUN_ID}**"
            echo "- Momento UTC: **$(date -u '+%Y-%m-%d %H:%M:%S')**"
          } >> "$GITHUB_STEP_SUMMARY"
